name: Bug 反馈
description: 报告无法完成流程、显示异常或错误结果
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请勿上传简历、API Key、录音、手机号或其他敏感信息。"
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 发生了什么？你原本期待什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 选择岗位…\n2. 点击…\n3. 出现…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: "例如：iPhone 15 / Safari，Windows 11 / Edge"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附已打码截图或公开错误码。
